name: Publish Plugin SDK

on:
  workflow_dispatch:
  push:
    tags:
      - 'sdk-v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. Node 24 does not always bundle a
      # new enough npm, and the failure without this reads as an auth error
      # rather than a version one.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Verify SDK package version matches tag
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION=$(node -p "require('./packages/errata-plugin-sdk/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)."
            exit 1
          fi

      # No token: the registry authenticates this job by its OIDC identity, which
      # is why `id-token: write` above is load-bearing. Provenance attestations
      # are generated automatically under trusted publishing, so `--provenance`
      # is not passed.
      - name: Publish @viscerous/errata-plugin-sdk
        working-directory: packages/errata-plugin-sdk
        run: npm publish --access public